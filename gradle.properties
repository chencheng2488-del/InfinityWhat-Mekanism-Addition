# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Environment Properties
# The Minecraft version must agree with the Forge version to get a valid artifact.
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
loader_version_range=[47,)

## Mod Properties

# The unique mod identifier for this add-on. Must match the String constant in the @Mod class.
mod_id=infwhat_mekanism
# The human-readable display name.
mod_name=Infinity What:Mekanism Addition
# The license of the mod.
mod_license=Apache License 2.0
# The mod version.
mod_version=1.0.0
# The group ID for the mod.
mod_group_id=com.bandybus.infwhat.mekanism
# The authors.
mod_authors=BandyBus
# The description shown in the mod list.
mod_description=Optional Mekanism addition for Infinity What. Adds a configurable infinite gas source; requires Infinity What and Mekanism.
java_toolchain_version=17
forge_version=47.4.10
forge_version_range=[47,)

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

## Local reference jars (kept in libs/, not committed)

# Core jar copied from Forge Ver/1.20.1/build/libs.
core_jar=infinity_what-1.20.1-forge-2.1.0b.jar
# Mekanism version used for the API and runtime testing.
mekanism_version=1.20.1-10.4.15.75
