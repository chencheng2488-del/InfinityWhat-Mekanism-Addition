plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        // Mekanism's official API repository.
        url = 'https://modmaven.dev/'
    }
    mavenLocal()
}

base {
    archivesName = "InfWhat_Mekanism_Addition_" + project.minecraft_version + "Forge"
}

tasks.named('jar', Jar).configure {
    archiveFileName = "InfWhat_Mekanism_Addition_${project.minecraft_version}Forge_${mod_version}.jar"
}

tasks.matching { it.name == 'reobfJar' }.configureEach {
    archiveFileName = "InfWhat_Mekanism_Addition_${project.minecraft_version}Forge_${mod_version}.jar"
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Real Forge 1.20.1 (net.minecraftforge), matching the core project.
    enable {
        forgeVersion = project.minecraft_version + '-' + project.forge_version
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/.cache")
    exclude("**/.cache/**")
}

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called
// 'modLocalRuntime'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // ModDevGradle's mod* configurations only accept module coordinates, so the local jars are
    // added to the plain compile classpath. The core jar is built in official mappings; the
    // Mekanism API jar is Mekanism's development API artifact.
    compileOnly files("libs/${core_jar}")
    // The full jar bundles the API and is required for reusing Mekanism's GUI element system.
    compileOnly files("libs/Mekanism-${mekanism_version}.jar")
    // JEI is a client-side recipe viewer; only its API is needed at compile time.
    compileOnly files("libs/jei-1.20.1-forge-15.74.0.233.jar")

    // Runtime testing: the full Mekanism jar is a production jar, so it must go through the
    // deobfuscation/remapping configuration. Enable this when you start runClient testing.
    // localRuntime files("libs/Mekanism-${mekanism_version}.jar")
    // localRuntime files("libs/${core_jar}")
}

// Expands the mods.toml / pack.mcmeta templates with the properties above.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
